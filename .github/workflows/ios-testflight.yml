name: iOS TestFlight

# The usual way to ship is `bun run deploy` on a laptop. This is the same fastlane lane on a
# GitHub runner, for when that machine isn't around: a pushed `ios-v*` tag, or a button.
on:
  push:
    tags:
      - "ios-v*"
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      VITE_API_BASE_URL: https://balance-app-mauve.vercel.app

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/frontend/ios

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Generate backend client (consumed by frontend)
        working-directory: apps/backend
        run: bunx nitro-client

      - name: Build web bundle + sync iOS
        working-directory: apps/frontend
        run: |
          bun run build
          bunx cap sync ios

      - name: Write ASC API key to disk
        run: |
          mkdir -p "$HOME/.appstoreconnect"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$HOME/.appstoreconnect/key.p8"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$HOME/.appstoreconnect/key.p8" >> "$GITHUB_ENV"

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      # No explicit profile download — fastlane's `sigh` (called inside the
      # `beta` lane) creates/regenerates the App Store distribution profile
      # via the ASC API every run. Pre-downloading via the GH action only
      # works for profiles manually registered in Apple Developer Portal,
      # which Xcode-managed automatic profiles aren't.

      - name: Fastlane beta
        working-directory: apps/frontend/ios
        run: bundle exec fastlane beta
