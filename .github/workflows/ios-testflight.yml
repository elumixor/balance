name: iOS TestFlight

# The beta build of the app, shipped by the same fastlane lane a laptop runs.
#
# Merging into `develop` sends a build to TestFlight pointed at the development API, but only when
# the merge touched something the app itself is made of — a backend-only change is already live on
# the development deployment and needs no new build on anybody's phone. An `ios-v*` tag builds
# against production instead, which is what a release is; the button does whatever branch it is
# pressed on.
on:
  push:
    branches:
      - develop
    tags:
      - "ios-v*"
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  # A macOS runner costs ten times what this one does, so what changed is worked out on a cheap
  # runner first: a merge that only moved the API is already live on the deployment the app talks
  # to, and nobody needs a new build on their phone for it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - "apps/frontend/**"
              - "apps/backend/server/routes/**"
              - "package.json"
              - "bun.lock"
              - ".github/workflows/ios-testflight.yml"

  testflight:
    needs: changes
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      # A tag is a release and talks to production; everything else is a beta of `develop` and
      # talks to the development deployment, which is where that branch's API is running.
      VITE_API_BASE_URL: ${{ startsWith(github.ref, 'refs/tags/') && 'https://balance-app-mauve.vercel.app' || 'https://balance-app-dev.vercel.app' }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/frontend/ios

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Generate backend client (consumed by frontend)
        working-directory: apps/backend
        run: bunx nitro-client

      - name: Build web bundle + sync iOS
        working-directory: apps/frontend
        run: |
          bun run build
          bunx cap sync ios

      - name: Write ASC API key to disk
        run: |
          mkdir -p "$HOME/.appstoreconnect"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$HOME/.appstoreconnect/key.p8"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$HOME/.appstoreconnect/key.p8" >> "$GITHUB_ENV"

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      # No explicit profile download — fastlane's `sigh` (called inside the
      # `beta` lane) creates/regenerates the App Store distribution profile
      # via the ASC API every run. Pre-downloading via the GH action only
      # works for profiles manually registered in Apple Developer Portal,
      # which Xcode-managed automatic profiles aren't.

      - name: Fastlane beta
        working-directory: apps/frontend/ios
        run: bundle exec fastlane beta
