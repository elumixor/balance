name: Vercel Deploy

# Pushing to `main` no longer deploys anything — `vercel.json` turns git deployments off, because
# a release is `bun run deploy` on a laptop. This asks Vercel to build and ship the current `main`
# itself, on a button, for when that laptop isn't around.
on:
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the production build
        run: curl --fail --silent --show-error -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

      - name: Where to watch it
        run: echo "Building at https://vercel.com/elumixors-projects/balance-app/deployments"
