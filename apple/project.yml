name: Balance
options:
  bundleIdPrefix: com.elumixor.balance
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  BalanceKit:
    path: BalanceKit

targets:
  Balance:
    type: application
    platform: iOS
    sources:
      - path: Balance
    dependencies:
      - package: BalanceKit
        product: BalanceKit
      - package: BalanceKit
        product: ClerkKit
      - target: "Balance Watch App"
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elumixor.balance
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        ENABLE_PREVIEWS: true
    info:
      path: Balance/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  "Balance Watch App":
    type: application
    platform: watchOS
    sources:
      - path: "Balance Watch App"
    dependencies:
      - package: BalanceKit
        product: BalanceKit
      - package: BalanceKit
        product: ClerkKit
      - target: "Balance Watch Widget Extension"
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elumixor.balance.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ENABLE_PREVIEWS: true
        SKIP_INSTALL: false
    info:
      path: "Balance Watch App/Info.plist"
      properties:
        WKApplication: true
        WKWatchOnly: false
        WKCompanionAppBundleIdentifier: com.elumixor.balance
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: "Balance Watch App/Balance Watch App.entitlements"
      properties:
        com.apple.security.application-groups:
          - group.com.elumixor.balance

  "Balance Watch Widget Extension":
    type: app-extension
    platform: watchOS
    sources:
      - path: "Balance Watch Widget"
    dependencies:
      - package: BalanceKit
        product: BalanceKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elumixor.balance.watchkitapp.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: false
    info:
      path: "Balance Watch Widget/Info.plist"
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: "Balance Watch Widget/Balance Watch Widget.entitlements"
      properties:
        com.apple.security.application-groups:
          - group.com.elumixor.balance

schemes:
  Balance:
    build:
      targets:
        Balance: all
    run:
      config: Debug
  "Balance Watch App":
    build:
      targets:
        "Balance Watch App": all
    run:
      config: Debug
