name: Balance
options:
  bundleIdPrefix: com.elumixor.balance
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  BalanceKit:
    path: BalanceKit

targets:
  Balance:
    type: application
    platform: iOS
    sources:
      - path: Balance
    dependencies:
      - package: BalanceKit
        product: BalanceKit
      - package: BalanceKit
        product: ClerkKit
      - target: "Balance Watch App"
        embed: true
    entitlements:
      path: Balance/Balance.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elumixor.balance
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: 464K6UHCU4
          PROVISIONING_PROFILE_SPECIFIER: "Balance AppStore"
    info:
      path: Balance/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  "Balance Watch App":
    type: application
    platform: watchOS
    sources:
      - path: "Balance Watch App"
    dependencies:
      - package: BalanceKit
        product: BalanceKit
      - package: BalanceKit
        product: ClerkKit
      - target: "Balance Watch Widget Extension"
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elumixor.balance.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ENABLE_PREVIEWS: true
        SKIP_INSTALL: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: 464K6UHCU4
          PROVISIONING_PROFILE_SPECIFIER: "Balance Watch App AppStore"
    info:
      path: "Balance Watch App/Info.plist"
      properties:
        WKApplication: true
        WKWatchOnly: false
        WKCompanionAppBundleIdentifier: com.elumixor.balance
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    # App Group entitlement temporarily removed: App Groups can only be created via one
    # interactive Xcode GUI session (not via API key or CLI automatic signing). Re-add once
    # `group.com.elumixor.balance` has been created that way. WatchSharedState already
    # degrades gracefully without it (widget just won't get the fast local snapshot).

  "Balance Watch Widget Extension":
    type: app-extension
    platform: watchOS
    sources:
      - path: "Balance Watch Widget"
    dependencies:
      - package: BalanceKit
        product: BalanceKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elumixor.balance.watchkitapp.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: false
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: 464K6UHCU4
          PROVISIONING_PROFILE_SPECIFIER: "Balance Watch Widget AppStore"
    info:
      path: "Balance Watch Widget/Info.plist"
      properties:
        CFBundleDisplayName: Balance
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # See note on the "Balance Watch App" target above re: App Group entitlement removal.

schemes:
  Balance:
    build:
      targets:
        Balance: all
    run:
      config: Debug
  "Balance Watch App":
    build:
      targets:
        "Balance Watch App": all
    run:
      config: Debug
