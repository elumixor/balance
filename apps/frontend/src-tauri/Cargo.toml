[package]
name = "balance-desktop"
version = "0.1.0"
description = "Balance for macOS"
authors = ["Vladyslav Yazykov"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "balance_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.4"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-deep-link = "2.4.9"
# The `deep-link` feature is what makes a second launch hand its `balance://` URL to the running
# instance instead of starting a second one beside it in the menu bar.
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
