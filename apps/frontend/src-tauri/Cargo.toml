[package]
name = "balance-desktop"
version = "1.0.1"
description = "Balance for macOS"
authors = ["Vladyslav Yazykov"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "balance_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
# `macos-private-api` is what lets the reminder card be a floating rounded card rather than a
# rectangle with a system background behind its corners.
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-localhost = "2.3.2"
tauri-plugin-notification = "2.3.3"
# Drives the menu bar's clock from the native side — see `spawn_agenda_ticks` in `lib.rs`. A
# webview timer gets throttled once its window is hidden; a tick from here doesn't.
tokio = { version = "1", features = ["time"] }

# The Dock icon and the reminder card's window level are AppKit's, and Tauri exposes neither.
# Unpinned minors on purpose: these are the versions tao and wry already resolve to, and a second
# objc2 in the binary would mean a second registration of the same Objective-C classes.
[target.'cfg(target_os = "macos")'.dependencies]
# One call: the uid the login item's `launchd` domain is named after (`gui/501`).
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSImage",
  "NSResponder",
  "NSWindow",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-deep-link = "2.4.9"
# Self-updating: the app asks the deployed site for `latest.json` and replaces itself. macOS
# forgets nothing about a bundle it has already opened, so the swap needs no privileges here.
tauri-plugin-updater = "2.9.0"
# The `deep-link` feature is what makes a second launch hand its `balance://` URL to the running
# instance instead of starting a second one beside it in the menu bar.
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
